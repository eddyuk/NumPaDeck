ShortDescription: Remaps numpad keys to key combos, typed text, media controls, or app and URL launchers, with multi-preset switching and full tray management.
Description: |-
  NumPaDeck is a small, zero-dependency Windows utility that remaps the numpad
  to whatever you want it to do, per saved preset. A low-level keyboard hook
  swallows the numpad key presses defined in your active preset and performs the
  mapped action instead: send a key combo, type a string of text, fire a media or
  volume key, or launch an app, URL, or command. Keys you do not map pass
  straight through. Numpad keys can appear inside combos (Ctrl+Numpad7). Presets
  can be switched on the fly by double-tapping a key, an optional translucent
  overlay mirrors the active preset, and everything is managed from the system
  tray with no admin rights required.
